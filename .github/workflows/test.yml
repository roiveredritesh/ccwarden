name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hooks-edition:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]  # Windows: paths in tests not yet portable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        working-directory: hooks-edition
        run: node --test "test/*.test.js"
